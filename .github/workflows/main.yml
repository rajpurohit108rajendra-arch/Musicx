
name: Build MusicX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MusicX-Android.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o MusicX-Android.zip -d extracted
          find extracted -name gradlew -exec chmod +x {} \;
          echo "PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicX-APK
          path: '**/build/outputs/apk/debug/*.apk'
