
name: Build MusicX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MusicX-Android.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o MusicX-Android.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -100
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -type f -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicX-APK
          path: '**/build/outputs/apk/debug/*.apk'
